{{ if .Values.appdynamics.required -}}
apiVersion: secrets-manager.tuenti.io/v1alpha1
kind: SecretDefinition
metadata:
  name: {{ include "cra-frontend.name" . }}.appdynamics
  namespace: {{ include "cra-frontend.namespace" . }}
spec:
  keysMap:
    APPDYNAMICS_CONTROLLER_HOST_NAME:
      key: APPDYNAMICS_CONTROLLER_HOST_NAME
      path: common/data/appdynamics/{{ .Values.appdynamics.environment }}/controller_env
    APPDYNAMICS_CONTROLLER_PORT:
      key: APPDYNAMICS_CONTROLLER_PORT
      path: common/data/appdynamics/{{ .Values.appdynamics.environment }}/controller_env
    APPDYNAMICS_CONTROLLER_SSL_ENABLED:
      key: APPDYNAMICS_CONTROLLER_SSL_ENABLED
      path: common/data/appdynamics/{{ .Values.appdynamics.environment }}/controller_env
  name: {{ include "cra-frontend.name" . }}.appdynamics
{{ end }}
