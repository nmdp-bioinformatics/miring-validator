apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "miring.name" . }}
  namespace: {{ include "miring.namespace" . }}
  labels:
    {{- include "miring.labels" . | nindent 4 }}
  {{- with .Values.configmaps.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  TZ: "America/Chicago"
  {{- range $key, $val := .Values.deployment.env_variables }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
