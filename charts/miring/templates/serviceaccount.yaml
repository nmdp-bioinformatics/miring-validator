{{- if .Values.serviceaccount.required -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "miring.name" . }}
  namespace: {{ include "miring.namespace" . }}
  labels:
    {{- include "miring.labels" . | nindent 4 }}
  {{- with .Values.serviceaccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.image.registrycreds.required }}
imagePullSecrets:
  - name: {{ include "miring.namespace" . }}-registry
{{- end }}
{{ end }}
