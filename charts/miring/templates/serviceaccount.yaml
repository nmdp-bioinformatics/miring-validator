{{- if .Values.serviceaccount.required -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cra-frontend.name" . }}
  namespace: {{ include "cra-frontend.namespace" . }}
  labels:
    {{- include "cra-frontend.labels" . | nindent 4 }}
  {{- with .Values.serviceaccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.image.registrycreds.required }}
imagePullSecrets:
  - name: {{ include "cra-frontend.namespace" . }}-registry
{{- end }}
{{ end }}
