apiVersion: v1
kind: Service
metadata:
  name: {{ include "miring.name" . }}-svc
  namespace: {{ include "miring.namespace" . }}
  labels:
    {{- include "miring.labels" . | nindent 4 }}
  {{- with .Values.deployment.ports.port1.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ports:
  - name: {{ .Values.deployment.ports.port1.name }}
    port: {{ .Values.deployment.ports.port1.containerport }}
    protocol: {{ .Values.deployment.ports.port1.protocol }}
    targetPort: {{ .Values.deployment.ports.port1.targetport }}
  selector:
    {{- include "miring.selectorLabels" . | nindent 4 }}
  type: {{ .Values.deployment.ports.port1.service.type }}
