nmdp:
  environment: dev
  namespace: miring-dev1

deployment:
  env_variables:
    DEVICE_VERSION: "2.0.2"
  debugmode: false
  ingress:
    tls_name: dev1-miring-nmdp-org-tls
    nginx:
      classname: nginx-public
  ports:
    port1:
      ingress:
        uri: dev1.miring.nmdp.org
  replicas: 1

vault:
  path: {}
secrets:
  SVC_USER:
    vault: rancher.nmdp.org/appdev/miring/dev1/serviceaccount/username@rancher
  SVC_PASS:
    vault: rancher.nmdp.org/appdev/miring/dev1/serviceaccount/password@rancher

