nmdp:
  environment: prod
  namespace: miring-prod

deployment:
  env_variables:
    DEVICE_VERSION: "2.0.2"
  debugmode: false
  ingress:
    tls_name: prod1-miring-nmdp-org-tls
  ports:
    port1:
      ingress:
        uri: prod1.miring.nmdp.org
  replicas: 1

vault:
  path: {}
secrets:
  SVC_USER:
    vault: rancher.nmdp.org/appdev/miring/prod1/serviceaccount/username@rancher
  SVC_PASS:
    vault: rancher.nmdp.org/appdev/miring/prod1/serviceaccount/password@rancher
    
appdynamics:
  environment: le
  required: false
  accesskey: 0d998b08-d32d-475c-93fa-0d4e790ce8cb
  applicationname: FHIR-DEV

podEnv:
