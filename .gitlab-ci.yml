.maven-build:
  extends:
    - .maven
  script:
    # jacoco report not yet available with failing unit tests
    # mvn clean -DskipTests -B -U -ff jacoco:prepare-agent ${MAVEN_BUILD_GOAL} jacoco:report
    - | 
      mvn clean -DskipTests -B -U -ff ${MAVEN_BUILD_GOAL} \
          -DaltSnapshotDeploymentRepository=private::default::${NEXUS_URL}/repository/${MAVEN_REPOSITORY_SNAPSHOTS} \
          -DaltReleaseDeploymentRepository=private::default::${NEXUS_URL}/repository/${MAVEN_REPOSITORY_RELEASES} 

      REPO=$(mvn -q help:evaluate -Dexpression=settings.localRepository -DforceStdout)
      GROUP_ID=$(mvn -q help:evaluate -Dexpression=project.groupId -DforceStdout)
      ARTIFACT_ID=$(mvn -q help:evaluate -Dexpression=project.artifactId -DforceStdout)
      VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
      
      echo "SONAR_PROJECT_KEY=${GROUP_ID}:${ARTIFACT_ID}" > maven.env
      
      JAVA_BINARIES=()
      LOCAL_ARTIFACTS=()
      
      ARTIFACT_HOME=${REPO}/$(echo "${GROUP_ID}" | sed "s/\./\//g")
      
      if [[ -d target/classes ]]; then
          JAVA_BINARIES+=( "target/classes" )
      fi
      
      if [[ -f "Dockerfile" ]]; then
          PACKAGING=$(mvn -q help:evaluate -Dexpression=project.packaging -DforceStdout)
          SOURCE=${ARTIFACT_HOME}/${ARTIFACT_ID}/${VERSION}/${ARTIFACT_ID}-${VERSION}.${PACKAGING}
          DESTINATION=target/${ARTIFACT_ID}-${VERSION}.${PACKAGING}
      
          if [[ -f ${SOURCE} ]]; then
              LOCAL_ARTIFACTS+=( `echo "${SOURCE}|${DESTINATION}"` )
          fi
      fi
      for MODULE in *; do
          if [[ -d "${MODULE}/target/classes" ]]; then
              JAVA_BINARIES+=( "${MODULE}/target/classes" )
          fi
      
          if [[ -f "${MODULE}/Dockerfile" ]]; then
              SOURCE=${ARTIFACT_HOME}/${MODULE}/${VERSION}/${MODULE}-${VERSION}.jar
              DESTINATION=${MODULE}/target/${MODULE}-${VERSION}.jar
      
              if [[ -f ${SOURCE} ]]; then
                  LOCAL_ARTIFACTS+=( `echo "${SOURCE}|${DESTINATION}"` )
              else
                  ARTIFACT_ID=$(mvn -q -f ${MODULE}/pom.xml help:evaluate -Dexpression=project.artifactId -DforceStdout)
                  PACKAGING=$(mvn -q -f ${MODULE}/pom.xml help:evaluate -Dexpression=project.packaging -DforceStdout)
                  SOURCE=${ARTIFACT_HOME}/${ARTIFACT_ID}/${VERSION}/${ARTIFACT_ID}-${VERSION}.${PACKAGING}
                  DESTINATION=${MODULE}/target/${ARTIFACT_ID}-${VERSION}.${PACKAGING}
      
                  if [[ -f ${SOURCE} ]]; then
                      LOCAL_ARTIFACTS+=( `echo "${SOURCE}|${DESTINATION}"` )
                  fi
              fi
          fi
      done
      
      echo "JOB_NAME=${CI_JOB_NAME}" >> maven.env
      echo MAVEN_VERSION=${VERSION} >> maven.env
      echo VERSION=${VERSION} | sed s/-SNAPSHOT/.${CI_PIPELINE_ID}/ >> maven.env
      echo "SONAR_JAVA_BINARIES=$(echo "${JAVA_BINARIES[@]}" | tr " " ,)" >> maven.env
      echo "LOCAL_ARTIFACTS='$(printf "%s " "${LOCAL_ARTIFACTS[@]}")'" >> maven.env
  artifacts:
    untracked: true
    paths:
      # artifacts for downstream sonar pipeline
      # source code to be analyzed
      - "**/src/*"
      - "**/pom.xml"
      - "pom.xml"
      - "**/target/classes/org/nmdp/miring/*"
      # coverage report and unit test count for sonarqube
      - "**/target/site/jacoco/*"
      - "**/target/surefire-reports/*"
    expire_in: 3 hrs
    public: false
    reports:
      dotenv: maven.env
      # junit: ["**/target/surefire-reports/TEST-*.xml", "**/target/failsafe-reports/TEST-*.xml"]


maven:test:prod:
  extends:
    - .maven-test
    - .env-prod
  rules:
    - if: '$BUILD_STACK != "prod"'
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^feature/ || $CI_COMMIT_BRANCH =~ /^bugfix/ || $CI_COMMIT_BRANCH =~ /^hotfix/
maven:build:prod:
  extends:
    - .maven-build
    - .env-prod
  rules:
    - if: '$BUILD_STACK != "prod"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $GIT_BRANCH_DEVELOP || $CI_COMMIT_BRANCH == $GIT_BRANCH_RELEASE || $CI_COMMIT_BRANCH == $GIT_BRANCH_MASTER'

maven:build:qa:
  extends:
    - .maven-build
    - .env-qa
  rules:
    - if: '$BUILD_STACK != "qa"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $GIT_BRANCH_DEVELOP || $CI_COMMIT_BRANCH == $GIT_BRANCH_RELEASE || $CI_COMMIT_BRANCH == $GIT_BRANCH_MASTER'
maven:test:qa:
  extends:
    - .maven-test
    - .env-qa
  rules:
    - if: '$BUILD_STACK != "qa"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^feature/ || $CI_COMMIT_BRANCH =~ /^bugfix/ || $CI_COMMIT_BRANCH =~ /^hotfix/'

maven:build:dev:
  extends:
    - .maven-build
    - .env-dev
  rules:
    - if: '$BUILD_STACK != "dev"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $GIT_BRANCH_DEVELOP || $CI_COMMIT_BRANCH == $GIT_BRANCH_RELEASE || $CI_COMMIT_BRANCH == $GIT_BRANCH_MASTER'
maven:test:dev:
  extends:
