  rules:
    - if: '$BUILD_STACK != "dev"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^feature/ || $CI_COMMIT_BRANCH =~ /^bugfix/ || $CI_COMMIT_BRANCH =~ /^hotfix/'

helm:
  stage: helm
  extends: .helm_build
  variables:
    # VAULT_AUTH_ROLE: gitlab.${CI_PROJECT_ID}.helm
    VAULT_AUTH_ROLE: "gitlab.${CI_PROJECT_ID}.${CI_ENVIRONMENT_NAME}"
  rules:
      - when: "always"
    # - changes:
    #   - charts/${HELM_CHART_NAME}/**/*
    #   - charts/${HELM_CHART_NAME}/*
  environment:
    name: helm
  secrets:
    SVC_USER:
      vault: rancher.nmdp.org/appdev/miring/dev1/serviceaccount/username@rancher
    SVC_PASS:
      vault: rancher.nmdp.org/appdev/miring/dev1/serviceaccount/password@rancher

