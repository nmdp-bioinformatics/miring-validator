helm_build:
  stage: helm
  extends: .helm_build
  rules:
    - when: "always"
  secrets:
    SVC_USER:
      vault: rancher.nmdp.org/appdev/miring/dev1/serviceaccount/username@rancher
    SVC_PASS:
      vault: rancher.nmdp.org/appdev/miring/dev1/serviceaccount/password@rancher
  variables:
    VAULT_AUTH_ROLE: "gitlab.${CI_PROJECT_ID}.${CI_ENVIRONMENT_NAME}"
    HELM_CHART_NAME: miring
  environment:
    name: helm

dev:
  stage: deploy
  extends: .helm_deploy
  secrets:
    KUBE_YAML:
      vault: rancher.nmdp.org/bio/miring/${CI_ENVIRONMENT_NAME}/kube_config/kube_config@rancher 
  variables: 
    VAULT_AUTH_ROLE: "gitlab.${CI_PROJECT_ID}.deploy_${CI_ENVIRONMENT_NAME}"
    HELM_CHART_NAME: miring
    HELM_VALUES_FILE: ./charts/miring/env/${CI_ENVIRONMENT_NAME}.yaml
    MANUAL_DEPLOY: "true"
  environment:
    name: dev1
    url: https://dev1.miring.nmdp.org

# DEV Deploy
dev1:
  stage: deploy
  extends:
    - .helm_deploy
  environment:
    name: dev1
    url: https://dev1.miring.nmdp.org
  resource_group: miring_${CI_ENVIRONMENT_NAME}
  variables:
    HELM_CHART_NAME: miring
    VAULT_AUTH_ROLE: gitlab.${CI_PROJECT_ID}.deploy_${CI_ENVIRONMENT_NAME}
    K8S_NS: miring-${CI_ENVIRONMENT_NAME}
    HELM_ENV: ${CI_ENVIRONMENT_NAME}
    HELM_VALUES_FILE: ./charts/miring/env/${CI_ENVIRONMENT_NAME}.yaml
    MANUAL_DEPLOY: "true"
    HELM_RELEASE: "${HELM_CHART_NAME}-${CI_ENVIRONMENT_NAME}"
  tags:
    - nmdp-prod-k8s
  secrets:
    KUBE_YAML:
      vault: rancher.nmdp.org/bio/miring/dev1/kube_config/kube_config@rancher


