stages:
  - maven
  - sonar-trigger
  - docker
  - helm
  - deploy

default:
  interruptible: true

include:
  - project: bethematch/appdev/ci/build
    file: "Environments.gitlab-ci.yml"
    ref: ${TEMPLATE_BRANCH}
  - project: bethematch/appdev/ci/sonar
    file: "Sonar-Trigger.gitlab-ci.yml"
    ref: ${TEMPLATE_BRANCH}
  - project: bethematch/appdev/ci/build
    file: "Docker.gitlab-ci.yml"
    ref: ${TEMPLATE_BRANCH}
  - project: bethematch/library/gitlab-ci
    ref: v23.01-04
    file:
      - job-helm-build.yaml
      - job-helm-deploy.yaml

variables:
    HELM_CHART_NAME: miring
    HELM_VALUES_FILE: ./charts/${HELM_CHART_NAME}/env/${CI_ENVIRONMENT_NAME}.yaml
    K8S_NS: miring-${CI_ENVIRONMENT_NAME}

# Added this so that helm_build can get the correct Vault role for the branch it is running on
workflow:
  rules:
    # Tag workflow
    - if: $CI_COMMIT_TAG != null
      variables:
        VAULT_AUTH_ROLE: gitlab.$CI_PROJECT_ID.tag
    # branch roles
    - if: $CI_COMMIT_BRANCH =~ /^develop|^release|^master/
      variables:
        VAULT_AUTH_ROLE: gitlab.$CI_PROJECT_ID.$CI_COMMIT_BRANCH
    # feature branches
    - if: $CI_COMMIT_BRANCH =~ /^feature/
      variables:
        VAULT_AUTH_ROLE: gitlab.$CI_PROJECT_ID.feature
    # bugfix and hotfix branches
    - if: $CI_COMMIT_BRANCH =~ /^bugfix|^hotfix/
      variables:
        VAULT_AUTH_ROLE: gitlab.$CI_PROJECT_ID.develop

.maven:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/maven:${MAVEN_VERSION}
  stage: maven
  variables:
    MAVEN_CLI_OPS: "${MAVEN_CLI_OPS}"
  before_script:
    - ln -sf /usr/share/zoneinfo/America/Chicago /etc/localtime
    - mkdir -p /cache/${CI_PROJECT_PATH}/maven/repository
    - echo "${MAVEN_SETTINGS_XML}" > /usr/share/maven/conf/settings.xml
  timeout: 6h

